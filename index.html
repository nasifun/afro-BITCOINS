<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AFROBITCOINS Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/moment@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-moment@latest"></script>

  <style>
    body { background: #111; color: #fff; font-family: 'Inter', sans-serif; padding: 20px; }
    .container { display: flex; }
    .sidebar { width: 200px; margin-right: 20px; }
    .main { flex-grow: 1; }
    button, input { padding: 5px 10px; margin-right: 5px; }
    table { width: 100%; margin-top: 20px; border-collapse: collapse; }
    th, td { border: 1px solid #444; padding: 10px; text-align: left; }
    .dashboard-cards { display: flex; gap: 20px; margin-bottom: 20px; }
    .card { background: #222; padding: 10px; border-radius: 8px; width: 100%; }
    .card-header { display: flex; justify-content: space-between; }
    .card-value { font-size: 1.5rem; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <img src="main-log2.png" alt="Logo" class="logo">
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="buy.html">Buy</a></li>
          <li><a href="profile.html">Profile</a></li>
          <li><a href="transactions.html">Transactions</a></li>
        </ul>
      </nav>
    </aside>

    <main class="main">
      <h2>📈 AFROBITCOINS Dashboard</h2>

      <div class="dashboard-cards">
        <div class="card">
          <div class="card-header">
            <span class="card-icon">€</span>
            <span class="card-label">Cash balance</span>
          </div>
          <div class="card-value">€0.00</div>
        </div>
        <div class="card">
          <div class="card-header">
            <span class="card-icon">₿</span>
            <span class="card-label">Bitcoin balance</span>
          </div>
          <div class="card-value">₿0.00017723</div>
        </div>
      </div>

      <div class="btc-chart-container" style="margin-top: 2rem; background: #151515; padding: 1.5rem; border-radius: 10px;">
        <h3 style="color: #f7931a;">BTC Price Chart & Investments</h3>
        <canvas id="btcChart" height="120"></canvas>
      </div>

      <form id="investmentForm" style="margin-top:20px;">
        <input type="number" id="amountEUR" placeholder="Amount in EUR" required>
        <input type="datetime-local" id="investmentTime" required>
        <button type="submit">➕ Add Investment</button>
        <button type="button" id="resetBtn">🗑️ Reset All</button>
      </form>

      <h3>📋 Investment History</h3>
      <table>
        <thead>
          <tr><th>EUR Amount</th><th>BTC Price at Purchase (EUR)</th><th>Current BTC Price (EUR)</th><th>Time</th></tr>
        </thead>
        <tbody id="investmentTable"></tbody>
      </table>
    </main>
  </div>

  <script>
    let investments = JSON.parse(localStorage.getItem('investments') || '[]');

    async function fetchBTCPrice(){
      const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=eur');
      const data = await res.json();
      return data.bitcoin.eur;
    }

    const ctx = document.getElementById('btcChart').getContext('2d');
    const btcChart = new Chart(ctx, {
      type: 'line',
      data: { datasets: [
        { label: 'Live BTC Price (EUR)', borderColor: '#f7931a', data: [], tension: 0.4 },
        { label: 'Your Investments', type: 'scatter', data: [], pointRadius: 6, pointBackgroundColor: 'orange' }
      ]},
      options: {
        responsive: true,
        scales: { x: { type: 'time', time: { unit: 'minute' }, ticks: { color: '#888' } }, y: { ticks: { color: '#fff' } } },
        plugins: { legend: { labels: { color: '#fff' } } }
      }
    });

    async function updateChart(){
      const price = await fetchBTCPrice();
      const now = new Date();
      btcChart.data.datasets[0].data.push({x:now,y:price});
      btcChart.data.datasets[1].data = investments.map(inv => ({x:new Date(inv.time),y:inv.btcPrice}));
      btcChart.update();
      renderInvestments(price);
    }

    document.getElementById('investmentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btcPrice = await fetchBTCPrice();
      const amountEUR = document.getElementById('amountEUR').value;
      const investmentTime = document.getElementById('investmentTime').value;
      investments.push({eur: amountEUR, btcPrice, time: investmentTime});
      localStorage.setItem('investments', JSON.stringify(investments));
      updateChart();
    });

    function renderInvestments(currentPrice){
      investmentTable.innerHTML = investments.map(i=>`<tr><td>€${i.eur}</td><td>€${i.btcPrice}</td><td>€${currentPrice}</td><td>${new Date(i.time).toLocaleString()}</td></tr>`).join('');
    }

    document.getElementById('resetBtn').addEventListener('click', () => {
      investments=[]; localStorage.clear(); updateChart();
    });

    window.onload=()=>{ updateChart(); setInterval(updateChart,300000); };
  </script>
</body>
</html>
