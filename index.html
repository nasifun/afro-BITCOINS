<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AFROBITCOINS Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/moment@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-moment@latest"></script>
  <style>
    body { background: #111; color: #fff; font-family: 'Inter', sans-serif; margin: 0; }
    .container { display: flex; min-height: 100vh; }
    .sidebar { width: 230px; background: #181818; padding: 36px 24px 24px 24px; display: flex; flex-direction: column; align-items: flex-start; }
    .logo { width: 100%; max-width: 160px; margin-bottom: 40px; border-radius: 12px; }
    nav ul { list-style: none; padding: 0; margin: 0; width: 100%; }
    nav ul li { margin-bottom: 22px; }
    nav ul li a { color: #fff; text-decoration: none; font-size: 1.1rem; padding: 10px 14px; border-radius: 8px; display: block; transition: background .2s; }
    nav ul li a:hover { background: #252525; color: #f7931a; }
    .main { flex: 1; padding: 34px 30px 30px 30px; min-width: 0; }
    .dashboard-cards { display: flex; gap: 18px; margin-bottom: 24px; }
    .card { background: #222; padding: 16px 22px; border-radius: 10px; min-width: 180px; flex: 1; display: flex; flex-direction: column; }
    .card-header { display: flex; align-items: center; gap: 10px; font-weight: bold; color: #eee; font-size: 1rem; }
    .card-icon { font-size: 1.4rem; }
    .card-value { font-size: 1.45rem; margin-top: 10px; color: #f7931a; }
    .price-top { display: flex; align-items: center; justify-content: space-between; }
    .price-info { display: flex; align-items: center; gap: 18px; font-size: 1.1rem; }
    .price-eur { font-size: 1.19rem; }
    .spinner { width: 20px; height: 20px; border: 3px solid #f7931a; border-top: 3px solid transparent; border-radius: 50%; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-left: 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btc-chart-container { margin-top: 2rem; background: #151515; padding: 1.5rem; border-radius: 14px; box-shadow: 0 6px 20px rgba(10,10,10,.15); max-width: 850px; width: 100%; }
    form#investmentForm { margin-top: 20px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 12px; }
    form#investmentForm input, form#investmentForm button { border-radius: 6px; border: none; font-size: 1rem; }
    form#investmentForm input[type="number"], form#investmentForm input[type="datetime-local"] { padding: 7px 10px; background: #222; color: #fff; border: 1px solid #333; width: 170px; }
    form#investmentForm button { padding: 7px 18px; background: #f7931a; color: #222; font-weight: 600; cursor: pointer; border: none; transition: background .18s; }
    form#investmentForm button[type=button] { background: #222; color: #f7931a; border: 1px solid #f7931a;}
    form#investmentForm button:hover { background: #222; color: #f7931a; border: 1px solid #f7931a;}
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    table, th, td { border: 1px solid #444; }
    th, td { padding: 10px 10px; text-align: left; }
    th { background: #181818; }
    .loading { color: #f7931a; font-size: 1.15rem; padding: 30px 0 15px 0; }
    @media (max-width: 900px) {
      .dashboard-cards { flex-direction: column; gap: 10px;}
      .btc-chart-container { max-width: 100%; }
    }
    @media (max-width: 650px) {
      .container { flex-direction: column; }
      .sidebar { width: 100%; flex-direction: row; padding: 20px; justify-content: space-between; }
      .logo { max-width: 100px;}
    }
  </style>
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <img src="main-log2.png" alt="Logo" class="logo" />
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="buy.html">Buy</a></li>
          <li><a href="profile.html">Profile</a></li>
          <li><a href="transactions.html">Transactions</a></li>
        </ul>
      </nav>
    </aside>
    <main class="main">
      <div class="dashboard-cards">
        <div class="card">
          <div class="card-header">
            <span class="card-icon">€</span>
            <span class="card-label">Cash balance</span>
            <span class="card-action">Details</span>
          </div>
          <div class="card-value">€0.00</div>
        </div>
        <div class="card">
          <div class="card-header">
            <span class="card-icon">₿</span>
            <span class="card-label">Bitcoin balance</span>
            <span class="card-action">Details</span>
          </div>
          <div class="card-value">₿0.00017723</div>
        </div>
      </div>
      <div class="price-chart">
        <div class="price-top">
          <div class="price-info">
            <span class="price-change">Live BTC Price</span>
            <span class="price-eur" id="btc-price">
              <span id="btc-price-text">Loading...</span>
              <span id="btc-spinner" class="spinner"></span>
            </span>
          </div>
          <div class="price-controls">
            <a href="buy.html"><button>Buy Bitcoin</button></a>
            <button>Selling</button>
          </div>
        </div>
        <div class="btc-chart-container">
          <h3 style="color: #f7931a;">BTC Price Chart with DCA</h3>
          <canvas id="btcChart" height="120"></canvas>
          <form id="investmentForm">
            <input type="number" id="amountEUR" placeholder="Amount in EUR" required>
            <input type="datetime-local" id="investmentDateTime" required>
            <button type="submit">➕ Add Investment</button>
            <button type="button" id="resetBtn">🗑️ Reset All</button>
          </form>
          <h3 style="color:#fff">📋 Investment History</h3>
          <table>
  <thead>
    <tr>
      <th>EUR Invested</th>
      <th>BTC Price at Purchase</th>
      <th>Date & Time</th>
      <th>Current Value (€)</th>
      <th>Profit/Loss (€)</th>
    </tr>
  </thead>
  <tbody id="investmentTable"></tbody>
</table>

        </div>
      </div>
    </main>
  </div>

  <script>
    let investments = JSON.parse(localStorage.getItem('investments') || '[]');
    let btcChart;
    let btcHistory = [];
    let currentBTCPrice = 0;

    async function fetchLivePrice() {
      const priceText = document.getElementById('btc-price-text');
      const spinner = document.getElementById('btc-spinner');
      spinner.style.display = 'inline-block';
      try {
        const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=eur');
        const data = await res.json();
        currentBTCPrice = data.bitcoin.eur;
        priceText.textContent = currentBTCPrice.toLocaleString('en-US', { style: 'currency', currency: 'EUR' });
        renderInvestments(); // update profit/loss with new price
      } catch {
        priceText.textContent = 'Error';
      } finally {
        spinner.style.display = 'none';
      }
    }

    async function fetchChartData() {
      const res = await fetch('https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=eur&days=365');
      const data = await res.json();
      return data.prices.map(p => ({ x: new Date(p[0]), y: p[1] }));
    }

    function findPriceAtDateTime(dtString) {
      const dt = new Date(dtString);
      // Find closest time in btcHistory
      let closest = btcHistory[0];
      let minDiff = Math.abs(dt - btcHistory[0].x);
      for (let i = 1; i < btcHistory.length; i++) {
        const diff = Math.abs(dt - btcHistory[i].x);
        if (diff < minDiff) {
          minDiff = diff;
          closest = btcHistory[i];
        }
      }
      return Math.round(closest.y * 100) / 100;
    }
function renderInvestments() {
  let totalInvested = 0;
  let totalCurrentValue = 0;
  let totalProfitLoss = 0;

  const rows = investments.map(inv => {
    const amountEUR = Number(inv.eur);
    const priceAtPurchase = Number(inv.btcPriceAtPurchase);
    const btcAmount = amountEUR / priceAtPurchase;
    const currentValue = btcAmount * currentBTCPrice;
    const profitLoss = currentValue - amountEUR;

    totalInvested += amountEUR;
    totalCurrentValue += currentValue;
    totalProfitLoss += profitLoss;

    const profitLossFormatted = profitLoss >= 0
      ? `<span style="color:#31e700;">+€${profitLoss.toFixed(2)}</span>`
      : `<span style="color:#e74c3c;">-€${Math.abs(profitLoss).toFixed(2)}</span>`;

    return `
      <tr>
        <td>€${amountEUR.toFixed(2)}</td>
        <td>€${priceAtPurchase}</td>
        <td>${new Date(inv.datetime).toLocaleString()}</td>
        <td>€${currentValue.toFixed(2)}</td>
        <td>${profitLossFormatted}</td>
      </tr>
    `;
  }).join('');

  // Add TOTAL row
  const totalProfitLossFormatted = totalProfitLoss >= 0
    ? `<span style="color:#31e700;">+€${totalProfitLoss.toFixed(2)}</span>`
    : `<span style="color:#e74c3c;">-€${Math.abs(totalProfitLoss).toFixed(2)}</span>`;

  const totalRow = `
    <tr style="font-weight:bold;background:#222;">
      <td>€${totalInvested.toFixed(2)}</td>
      <td></td>
      <td style="color:#f7931a;">TOTAL</td>
      <td>€${totalCurrentValue.toFixed(2)}</td>
      <td>${totalProfitLossFormatted}</td>
    </tr>
  `;

  document.getElementById('investmentTable').innerHTML = rows + totalRow;
}


   async function drawChart() {
  const ctx = document.getElementById('btcChart').getContext('2d');
  btcHistory = await fetchChartData();
  btcChart = new Chart(ctx, {
    type: 'scatter',
    data: {
      datasets: [
        {
          label: 'BTC Price (EUR)',
          data: btcHistory,
          borderColor: '#ffb119',
          borderWidth: 2,
          backgroundColor: 'rgba(247,147,26,0.10)',
          showLine: true,
          fill: false,
          pointRadius: 0,
          tension: 0.2,
          order: 1
        },
        {
          label: 'Your DCA Buys',
          data: investments.map(inv => ({
            x: new Date(inv.datetime),
            y: Number(inv.btcPriceAtPurchase)
          })),
          type: 'scatter',
          pointRadius: 8,
          pointBackgroundColor: '#fff',
          pointBorderColor: '#f7931a',
          pointBorderWidth: 3,
          order: 2
        }
      ]
    },
    options: {
      responsive: true,
      scales: {
        x: { type: 'time', time: { tooltipFormat: 'YYYY-MM-DD HH:mm', unit: 'month' }, ticks: { color: '#888' } },
        y: { ticks: { color: '#fff' } }
      },
      plugins: { legend: { labels: { color: '#fff' } } }
    }
  });
  renderInvestments();
}


    document.getElementById('investmentForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const eur = document.getElementById('amountEUR').value;
      const datetime = document.getElementById('investmentDateTime').value;
      if (!eur || !datetime || !btcHistory.length) return;
      const btcPriceAtPurchase = findPriceAtDateTime(datetime);
      const newInv = { eur, btcPriceAtPurchase, datetime };
      investments.push(newInv);
      localStorage.setItem('investments', JSON.stringify(investments));
      btcChart.data.datasets[1].data.push({ x: new Date(datetime), y: btcPriceAtPurchase });
      btcChart.update();
      renderInvestments();
      this.reset();
    });

    document.getElementById('resetBtn').addEventListener('click', function () {
      investments = [];
      localStorage.removeItem('investments');
      btcChart.data.datasets[1].data = [];
      btcChart.update();
      renderInvestments();
    });

    window.onload = async () => {
      await fetchLivePrice();
      await drawChart();
      setInterval(fetchLivePrice, 300000);
    };

    


    
  </script>
</body>
</html>
